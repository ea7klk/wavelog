        volumeMounts:
        - mountPath: /var/lib/mysql
          name: v-c6de53c50ebb586a
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: v-c6de53c50ebb586a
        persistentVolumeClaim:
          claimName: v-c6de53c50ebb586a
      - emptyDir:
          medium: Memory
          sizeLimit: 67108864
        name: shm
