        image: mariadb@sha256:e101f9db31916a5d4d7d594dd0dd092fb23ab4f499f1d7a7425d1afd4162c4bc
        imagePullPolicy: IfNotPresent
        name: wavelog-db
        ports:
        - containerPort: 3306
          name: p3306-tcp
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 3306
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
        startupProbe:
          failureThreshold: 180
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 3306
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
