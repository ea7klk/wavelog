  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: wavelog-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wavelog-db
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - mariadbd
